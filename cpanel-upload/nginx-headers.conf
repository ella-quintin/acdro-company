# ACDRO — Nginx version of the same security headers.
# ONLY needed if .htaccess uploaded via cPanel has no effect.
# The live site answers "Server: nginx"; Nginx never reads .htaccess.
# Give this file to your hosting support and let them fill in the
# certificate/root paths, then reload Nginx.

server {
    listen 80;
    server_name acdro.org www.acdro.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name acdro.org www.acdro.org;

    # --- Fill these in with the real paths from the host ---
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    root                /path/to/public_html;
    index               index.html;

    # --- Security headers (same policy as .htaccess) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.sanity.io; connect-src 'self' https://22hj55di.api.sanity.io https://22hj55di.apicdn.sanity.io https://cdn.sanity.io; font-src 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), idle-detection=(), interest-cohort=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
